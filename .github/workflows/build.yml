name: build
on:
  push:
    branches: [main]
    paths:
      &paths [
        "internal/**",
        "frontend/**",
        "main.go",
        "assets.go",
        "go.mod",
        "go.sum",
        "sqlc.yaml",
        "tygo.yaml",
        "Dockerfile",
        ".github/workflows/build.yml",
      ]
  pull_request:
    paths: *paths
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.1" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      # assets.go embeds frontend/dist, so the root package cannot even be
      # type-checked until the Vite build has produced it.
      - run: npm --prefix frontend ci && npm --prefix frontend run typecheck && npm --prefix frontend run build
      - run: go vet ./... && go test ./...
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 && sqlc generate && git diff --exit-code internal/db
      # frontend/src/api.gen.ts is committed and typed against by the frontend,
      # so tygo output has to stay in sync with internal/api.
      - run: go tool tygo generate && git diff --exit-code frontend/src/api.gen.ts
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME || 'hyl' }}/hyl:latest
            ${{ secrets.DOCKER_HUB_USERNAME || 'hyl' }}/hyl:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
